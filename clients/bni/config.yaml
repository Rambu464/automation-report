sentiment_brief:
  brief_uuid: b9180e96-ce1b-417b-92ff-610aa12b1f3a
  deskripsi: Koreksi Sentimen BNI
  analyst_verdict: |
    Sentimen Bank Negara Indonesia, BNI, PT Bank Negara Indonesia Persero Tbk, atau emiten BBNI dikategorikan berdasarkan dampak reputasional terhadap institusi, manajemen, pegawai, kantor cabang, anak usaha, produk, layanan, kanal digital, nasabah, kinerja bisnis, tata kelola, kepatuhan, dan kepercayaan publik terhadap BNI. Penilaian tidak boleh hanya didasarkan pada kemunculan kata BNI, BBNI, bank, rupiah melemah, IHSG turun, lelang, iklan, fraud, kasus, atau kata bernuansa negatif lain. Sentimen harus ditentukan dari posisi BNI dalam artikel, apakah BNI menjadi subjek utama yang dinilai, pihak yang terdampak, pihak yang disalahkan, pihak yang memberi solusi, atau hanya disebut sebagai konteks/passing mention.

    Artikel dikategorikan negative apabila memuat narasi yang secara langsung memperburuk citra, kepercayaan publik, kredibilitas bisnis, atau reputasi BNI. Ini mencakup gangguan layanan, transaksi gagal, dana nasabah hilang, fraud, pembobolan rekening, phishing, skimming, kebocoran data, serangan siber, kredit fiktif, penyimpangan kredit, penggelapan dana, penyalahgunaan wewenang, gugatan hukum, sanksi regulator, pelanggaran kepatuhan, kasus korupsi, pencucian uang, audit bermasalah, demonstrasi yang menargetkan BNI, maupun kritik kuat yang menempatkan BNI sebagai pihak bermasalah. Artikel juga negative apabila framing utama menyatakan BNI lalai, tidak transparan, lambat menangani masalah, merugikan nasabah, gagal melindungi data/dana nasabah, atau gagal menjaga tata kelola.

    Artikel dikategorikan neutral apabila pemberitaan bersifat informatif, administratif, prosedural, pasar modal umum, makroekonomi, kurs, jadwal, iklan, lelang, pengumuman, atau hanya menyebut BNI tanpa dampak reputasional langsung. Artikel terkait IHSG, indeks saham, bursa, rekomendasi saham, pergerakan harga saham BBNI, kurs rupiah, rupiah melemah/menguat, dolar AS, BI rate, suku bunga, lelang aset/agunan, iklan, advertorial, promo, jadwal layanan, atau konten direktori bisnis dikategorikan neutral selama tidak memuat narasi yang secara langsung menyalahkan, mengkritik, atau memperburuk reputasi BNI.

    Artikel dikategorikan positive apabila memuat narasi yang secara jelas meningkatkan citra BNI. Ini mencakup pertumbuhan kinerja, peningkatan laba, aset, kredit, DPK, CASA, efisiensi, kualitas aset, digitalisasi layanan, inovasi produk, penghargaan, kerja sama strategis, dukungan terhadap UMKM, ekspor, diaspora, transaksi internasional, pembiayaan hijau, ESG, CSR, literasi dan inklusi keuangan, peningkatan kualitas layanan, keberhasilan transformasi bisnis, penguatan tata kelola, kontribusi terhadap ekonomi nasional, serta apresiasi dari pemerintah, regulator, nasabah, investor, analis, mitra, atau masyarakat. Sesuai permintaan client, artikel yang memuat isu negatif juga dikategorikan positive apabila fokus pemberitaan berada pada klarifikasi resmi, bantahan, tanggapan manajemen, investigasi internal, dukungan terhadap proses hukum, penindakan oknum, penerapan zero tolerance, pengembalian dana, penyelesaian keluhan, penguatan sistem, atau langkah mitigasi BNI, karena narasi tersebut dibaca sebagai upaya pemulihan reputasi, perlindungan nasabah, dan penguatan tata kelola.
  negative_guidelines:
  - Negative jika artikel memperburuk citra BNI secara langsung dan BNI menjadi subjek utama yang disalahkan, dikritik, diperiksa, digugat, atau dianggap merugikan publik
  - Negative jika artikel memuat keluhan nasabah terhadap layanan BNI, termasuk layanan kantor cabang, call center, ATM, mobile banking, internet banking, kartu debit, kartu kredit, rekening, transfer, QRIS, atau kanal digital BNI lainnya
  - Negative jika terjadi gangguan sistem, error, downtime, kendala transaksi, transaksi gagal, double debit, dana tertahan, saldo berkurang, dana hilang, atau kerugian finansial yang dikaitkan langsung dengan BNI
  - Negative jika artikel memuat phishing, social engineering, skimming, pembobolan rekening, pembobolan ATM, pencurian data, kebocoran data, serangan siber, pemalsuan akun, atau kejahatan digital yang menggunakan nama BNI dan menimbulkan keresahan nasabah
  - Negative jika artikel memuat fraud, penipuan, manipulasi data, pemalsuan dokumen, kredit fiktif, penyimpangan kredit, penggelapan dana, atau penyalahgunaan wewenang yang melibatkan pegawai, oknum pegawai, mitra, agen, kantor cabang, atau jaringan BNI
  - Negative jika artikel memuat gugatan hukum, somasi, dakwaan, putusan pengadilan, penyidikan, penyelidikan, pemeriksaan, sanksi OJK, sanksi regulator, audit bermasalah, atau dugaan pelanggaran yang menempatkan BNI sebagai pihak bermasalah
  - Negative jika artikel memuat isu korupsi, suap, gratifikasi, pencucian uang, pendanaan ilegal, transaksi mencurigakan, atau pelanggaran kepatuhan yang dikaitkan langsung dengan BNI, pegawai BNI, anak usaha BNI, atau proses bisnis BNI
  - Negative jika artikel membahas BNI Life, BNI Sekuritas, BNI Asset Management, BNI Finance, hibank, atau anak usaha/afiliasi BNI lain dalam konteks gagal bayar, investasi bermasalah, fraud, sanksi, gugatan, kerugian nasabah, atau tata kelola bermasalah
  - Negative jika artikel memuat demonstrasi, unjuk rasa, protes, petisi, atau aksi publik yang secara jelas menargetkan BNI, kantor BNI, kebijakan BNI, layanan BNI, atau penyelesaian kasus BNI
  - Negative jika artikel memuat kritik dari nasabah, regulator, aparat hukum, DPR, pemerintah, pengamat, investor, analis, serikat pekerja, atau masyarakat terhadap layanan, tata kelola, kebijakan, produk, atau tindakan BNI
  - Negative jika artikel membahas penurunan laba, tekanan kinerja, kenaikan NPL, kredit bermasalah, likuiditas tertekan, beban meningkat, target meleset, atau penurunan kualitas aset dengan framing yang menekan reputasi atau fundamental BNI
  - Negative jika artikel membahas saham BBNI dengan framing negatif karena fundamental memburuk, risiko kredit meningkat, kinerja melemah, prospek turun, atau kepercayaan investor menurun terhadap BNI
  - Negative jika artikel membahas lelang agunan/aset BNI dengan framing bahwa BNI melakukan pelanggaran prosedur, melelang secara tidak sah, merugikan debitur/nasabah, digugat, diprotes, atau terlibat sengketa agunan
  - Negative jika artikel memuat narasi bahwa BNI tidak responsif, tidak transparan, lambat menangani masalah, mengabaikan nasabah, gagal melindungi dana/data nasabah, atau gagal menjaga tata kelola
  - Negative jika artikel viral di media sosial karena keluhan, protes, dugaan kerugian, gangguan layanan, atau pengalaman buruk nasabah terhadap BNI
  - Negative jika judul atau isi artikel memuat kasus negatif dan BNI menjadi fokus masalah, bukan sekadar rekening penerima, sponsor, bank penyalur, bank kustodian, bank pembayaran, atau passing mention
  neutral_guidelines:
  - Neutral jika BNI hanya disebut sebagai passing mention tanpa dampak reputasional langsung
  - Neutral jika artikel bernada negatif secara umum tetapi BNI hanya disebut sekilas, bukan sebagai pelaku, pihak yang disalahkan, objek kritik, atau pusat masalah
  - Neutral jika artikel terkait IHSG, indeks saham, indeks bisnis, bursa, pasar modal, rekomendasi saham, analisis teknikal, daftar saham, top gainers, top losers, kapitalisasi pasar, atau pergerakan saham BBNI tanpa framing reputasional yang kuat terhadap BNI
  - Neutral jika judul atau isi artikel memuat kata IHSG, indeks, bursa, saham, emiten, BBNI, top gainers, top losers, net buy, net sell, asing borong, asing jual, atau rekomendasi teknikal, sepanjang pembahasan hanya tentang pasar dan bukan tuduhan/kritik terhadap BNI
  - Neutral jika artikel membahas kurs rupiah, rupiah melemah, rupiah menguat, dolar AS, valuta asing, BI rate, suku bunga, inflasi, yield obligasi, ekonomi global, atau makroekonomi dan BNI hanya disebut sebagai bank, emiten, sumber kurs, penyedia layanan, atau bagian dari sektor perbankan
  - Neutral jika judul atau isi artikel memuat kata Kurs, Rupiah Melemah, Rupiah Menguat, Dolar AS, Valas, BI Rate, atau Suku Bunga tanpa narasi yang secara langsung memperburuk reputasi BNI
  - Neutral jika artikel berupa Iklan, Advertorial, Promo, Sponsored Content, Pengumuman, Info Layanan, atau konten komersial yang tidak memuat tuduhan, kritik, keluhan, atau dampak reputasional negatif terhadap BNI
  - Neutral jika judul artikel memuat kata Iklan, Advertorial, Promo, Sponsored, Pengumuman, atau Info Layanan dan isi artikel tidak membahas masalah reputasional BNI
  - Neutral jika artikel berupa Lelang, Jadwal Lelang, Info Lelang, Pengumuman Lelang, Lelang Agunan, Lelang Rumah, Lelang Tanah, Lelang Kendaraan, atau daftar aset lelang yang menyebut BNI sebagai kreditur, pemohon lelang, bank, atau pihak administratif tanpa sengketa atau tuduhan pelanggaran
  - Neutral jika judul artikel memuat kata Lelang dan isi artikel hanya berisi jadwal, daftar aset, lokasi, harga limit, uang jaminan, prosedur, atau pengumuman lelang tanpa menyalahkan BNI
  - Neutral jika artikel kriminal hanya menyebut rekening BNI sebagai sarana transaksi, rekening penerima, rekening korban, rekening pelaku, atau alat pembayaran, selama BNI bukan pelaku, bukan pihak yang disalahkan, dan tidak menjadi fokus masalah
  - Neutral jika artikel kepolisian membahas patroli objek vital, pengamanan bank, simulasi keamanan, kunjungan aparat, atau pengamanan kantor BNI tanpa adanya insiden yang merugikan reputasi BNI
  - Neutral jika artikel membahas penyaluran bansos, bantuan pemerintah, subsidi, gaji, pensiun, Kartu Prakerja, bantuan pendidikan, atau program publik melalui perbankan dan BNI hanya disebut sebagai bank penyalur
  - Neutral jika artikel membahas tarif tiket KRL, MRT, LRT, Whoosh, kapal, tol, parkir, transportasi, atau pembayaran umum dan BNI hanya disebut sebagai kanal pembayaran, kartu, bank partner, atau penyedia metode transaksi
  - Neutral jika artikel memuat tanggapan stakeholder atau regulator terhadap industri perbankan secara umum dan tidak secara spesifik mengkritik BNI
  - Neutral jika artikel berupa profil bisnis umum, direktori, jadwal layanan, laporan agenda, lowongan kerja, kegiatan internal, atau informasi administratif tanpa narasi reputasional yang jelas
  - Neutral jika artikel membahas tentang pengembalian dana korupsi melalui rekening BNI atau melalui bank BNI
  positive_guidelines:
  - Positive jika artikel memuat isu negatif tetapi fokus pemberitaan adalah klarifikasi resmi, bantahan, tanggapan manajemen, investigasi internal, proses hukum, penyelesaian keluhan, pengembalian dana, atau langkah mitigasi BNI
  - Positive jika BNI menyatakan menghormati proses hukum, mendukung investigasi, menindak oknum, memperkuat sistem, menerapkan zero tolerance, menjalankan mitigasi, atau menunjukkan komitmen penyelesaian terhadap isu yang sedang diberitakan
  - Positive jika artikel memuat respons resmi BNI terhadap kasus negatif dan framing artikel menunjukkan BNI aktif menangani masalah, kooperatif terhadap proses hukum, melindungi nasabah, memperbaiki sistem, atau menjaga tata kelola
  - Positive jika artikel membahas pengembalian dana nasabah, penyelesaian keluhan, penindakan oknum, penguatan sistem keamanan, investigasi internal, atau langkah korektif BNI sebagai fokus utama pemberitaan
  - Positive jika artikel memuat narasi yang meningkatkan citra BNI secara jelas
  - Positive jika artikel membahas pertumbuhan laba, aset, kredit, DPK, CASA, fee based income, transaksi digital, efisiensi, profitabilitas, kualitas aset, NPL turun, atau kinerja keuangan BNI secara positif
  - Positive jika artikel membahas transformasi bisnis, digitalisasi layanan, peningkatan pengguna, pengembangan fitur, peningkatan keamanan, atau perbaikan pengalaman nasabah pada wondr by BNI, BNI Mobile Banking, BNI Direct, ATM, Agen46, kartu, atau kanal digital BNI lainnya
  - Positive jika artikel membahas ekspansi bisnis, penguatan modal, strategi pertumbuhan, peningkatan layanan wholesale banking, consumer banking, wealth management, transaction banking, atau international banking dengan framing positif
  - Positive jika artikel membahas peran BNI dalam mendukung UMKM, ekspor, diaspora Indonesia, remitansi, transaksi internasional, trade finance, pembiayaan produktif, atau penguatan ekonomi nasional
  - Positive jika artikel membahas kerja sama strategis BNI dengan pemerintah, BUMN, korporasi, lembaga internasional, institusi keuangan, kampus, komunitas, atau mitra bisnis lain dengan framing memperkuat bisnis atau reputasi BNI
  - Positive jika artikel memuat penghargaan, apresiasi, pengakuan, ranking positif, predikat terbaik, sertifikasi, atau penilaian positif yang diraih BNI
  - Positive jika artikel membahas CSR, ESG, green financing, sustainable finance, bantuan sosial, kegiatan lingkungan, pemberdayaan masyarakat, pendidikan, kesehatan, literasi keuangan, atau inklusi keuangan yang dilakukan BNI dengan framing positif
  - Positive jika artikel memuat testimoni positif dari nasabah, mitra, regulator, pemerintah, analis, investor, atau masyarakat terhadap BNI
  - Positive jika artikel membahas saham BBNI dengan framing prospek positif, fundamental kuat, valuasi menarik, rekomendasi beli, kinerja emiten membaik, atau kepercayaan investor meningkat karena kinerja BNI
  - Positive jika artikel membahas BNI mendukung acara, mensponsori kegiatan, atau menjadi mitra strategis acara dengan framing yang jelas membangun reputasi positif, bukan sekadar penyebutan administratif
  - Positive jika artikel membahas kegiatan internal seperti pengembangan talenta, budaya kerja, pelatihan pegawai, employer branding, relawan, kegiatan sosial, olahraga, atau komunitas BNI dengan framing positif
  output_rules:
  - Jika rule relevan dan nilai asli tidak sesuai, set perlu_koreksi=true lalu isi sentiment mengikuti target rule
  - Jika tidak ada rule relevan, set perlu_koreksi=false dan isi sentiment dengan nilai asli dari field tersebut
  - Confidence wajib di rentang 0.0-1.0
