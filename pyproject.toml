[project]
name = "newstent"
version = "0.1.0"
description = "Analyst Workflow Automation Tool for Newstensity (Binokular) media monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "python-calamine>=0.3.0",
    "xlsxwriter>=3.2.0",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.10.0",
    "openai>=1.55.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "python-pptx>=1.0.2",
    "matplotlib>=3.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
